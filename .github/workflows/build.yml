name: Build Health Checker App V2

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: 자바 환경 세팅
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 기계 버전 8.4로 고정 세팅
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'

    - name: 앱 코드 자동 생성 (V2.2 안전 장치 강화)
      run: |
        mkdir -p app/src/main/java/com/samsung/healthchecker
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/values
        
        # 1. 고정 서명 키 생성
        keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey \
          -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
          -dname "CN=Android Debug,O=Android,C=US"

        # 2. 설정 파일 생성
        cat << 'EOF' > gradle.properties
        android.useAndroidX=true
        android.enableJetifier=true
        EOF

        cat << 'EOF' > settings.gradle
        pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
        dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
        rootProject.name = "HealthChecker"
        include ':app'
        EOF
        
        cat << 'EOF' > build.gradle
        plugins { id 'com.android.application' version '8.1.1' apply false; id 'org.jetbrains.kotlin.android' version '1.9.0' apply false }
        EOF
        
        cat << 'EOF' > app/build.gradle
        plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
        android {
            namespace 'com.samsung.healthchecker'
            compileSdk 34
            defaultConfig { applicationId "com.samsung.healthchecker"; minSdk 24; targetSdk 34; versionCode 3; versionName "2.2" }
            signingConfigs {
                debugKeystore {
                    storeFile file("../debug.keystore")
                    storePassword "android"
                    keyAlias "androiddebugkey"
                    keyPassword "android"
                }
            }
            buildTypes {
                debug { signingConfig signingConfigs.debugKeystore }
                release { signingConfig signingConfigs.debugKeystore }
            }
            compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
            kotlinOptions { jvmTarget = '17' }
        }
        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.9.0'
        }
        EOF
        
        # 3. 시스템 권한 파일
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <queries><package android:name="com.sec.android.app.shealth" /></queries>
            <application android:label="Health 검증앱" android:theme="@style/Theme.MaterialComponents.Light.NoActionBar">
                <activity android:name="com.samsung.healthchecker.MainActivity" android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF
        
        # 4. 레이아웃
        cat << 'EOF' > app/src/main/res/layout/activity_main.xml
        <?xml version="1.0" encoding="utf-8"?>
        <ScrollView xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:background="#F4F7F9">
            <LinearLayout android:orientation="vertical" android:layout_width="match_parent" android:layout_height="wrap_content" android:padding="16dp">
                <TextView android:text="⚙️ Health 검증 도우미 v2.2" android:textSize="22sp" android:textStyle="bold" android:textColor="#0054A6" android:layout_width="match_parent" android:layout_height="wrap_content" android:layout_marginBottom="16dp" android:gravity="center"/>
                
                <LinearLayout android:orientation="vertical" android:background="#FFFFFF" android:elevation="4dp" android:padding="16dp" android:layout_width="match_parent" android:layout_height="wrap_content" android:layout_marginBottom="16dp">
                    <TextView android:text="📱 내 폰 정보" android:textSize="18sp" android:textStyle="bold" android:textColor="#0054A6" android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_marginBottom="8dp"/>
                    <TextView android:id="@+id/tv_phone_info" android:text="불러오는 중..." android:textColor="#333333" android:textSize="14sp" android:layout_width="wrap_content" android:layout_height="wrap_content"/>
                </LinearLayout>
                
                <LinearLayout android:orientation="vertical" android:background="#FFFFFF" android:elevation="4dp" android:padding="16dp" android:layout_width="match_parent" android:layout_height="wrap_content" android:layout_marginBottom="16dp">
                    <TextView android:text="🔍 실시간 자동 검증 결과" android:textSize="18sp" android:textStyle="bold" android:textColor="#0054A6" android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_marginBottom="8dp"/>
                    <TextView android:id="@+id/tv_sys_perm" android:text="1. 시스템 위치 권한 : ⏳ 대기중" android:textSize="15sp" android:textStyle="bold" android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_marginBottom="6dp"/>
                    <TextView android:id="@+id/tv_sh_perm" android:text="2. 헬스 설정 위치 정보 : ⏳ 대기중" android:textSize="15sp" android:textStyle="bold" android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_marginBottom="16dp"/>
                    <TextView android:id="@+id/tv_final_status" android:text="📢 상태 분석중..." android:textSize="18sp" android:textStyle="bold" android:layout_width="match_parent" android:layout_height="wrap_content" android:layout_marginBottom="12dp" android:gravity="center" android:padding="8dp"/>
                    <Button android:id="@+id/btn_health_settings" android:text="📍 헬스 '위치 정보' 토글 확인하기 ↗" android:backgroundTint="#0054A6" android:textColor="#FFFFFF" android:layout_width="match_parent" android:layout_height="wrap_content"/>
                </LinearLayout>
                
                <LinearLayout android:orientation="vertical" android:background="#FFFFFF" android:elevation="4dp" android:padding="16dp" android:layout_width="match_parent" android:layout_height="wrap_content">
                    <TextView android:text="⌚ 워치 도우미 앱 무선 설치" android:textSize="18sp" android:textStyle="bold" android:textColor="#0054A6" android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_marginBottom="8dp"/>
                    <EditText android:id="@+id/et_ip" android:hint="워치 IP 주소 입력 (예: 192.168.0.15)" android:inputType="textUri" android:layout_width="match_parent" android:layout_height="wrap_content" android:layout_marginBottom="8dp"/>
                    <Button android:id="@+id/btn_adb_install" android:text="📡 워치 앱 무선 전송 (ADB 연동)" android:backgroundTint="#0054A6" android:textColor="#FFFFFF" android:layout_width="match_parent" android:layout_height="wrap_content"/>
                </LinearLayout>
            </LinearLayout>
        </ScrollView>
        EOF
        
        # 5. 동작 코드 (안전 코드 적용)
        cat << 'EOF' > app/src/main/java/com/samsung/healthchecker/MainActivity.kt
        package com.samsung.healthchecker
        import android.Manifest
        import android.content.Intent
        import android.content.pm.PackageManager
        import android.graphics.Color
        import android.net.Uri
        import android.os.Build
        import android.os.Bundle
        import android.provider.Settings
        import android.widget.Button
        import android.widget.EditText
        import android.widget.TextView
        import android.widget.Toast
        import androidx.appcompat.app.AppCompatActivity
        
        class MainActivity : AppCompatActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_main)
                
                findViewById<Button>(R.id.btn_health_settings).setOnClickListener {
                    try {
                        startActivity(Intent(Intent.ACTION_VIEW, Uri.parse("shealth://settings")))
                    } catch (e: Exception) {
                        startActivity(Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS).apply { data = Uri.parse("package:com.sec.android.app.shealth") })
                        Toast.makeText(this, "설정 화면으로 이동합니다.", Toast.LENGTH_SHORT).show()
                    }
                }
                
                findViewById<Button>(R.id.btn_adb_install).setOnClickListener {
                    val ip = findViewById<EditText>(R.id.et_ip).text.toString()
                    if (ip.isNotEmpty()) {
                        Toast.makeText(this, "워치($ip)로 무선 전송 시작 (V3.0 예정 기능)", Toast.LENGTH_LONG).show()
                    } else {
                        Toast.makeText(this, "IP 주소를 입력해 주세요!", Toast.LENGTH_SHORT).show()
                    }
                }
            }
            
            override fun onResume() {
                super.onResume()
                refreshStatus()
            }
            
            private fun refreshStatus() {
                val phoneOs = Build.DISPLAY
                var healthVersion = "설치 안됨"
                try {
                    healthVersion = packageManager.getPackageInfo("com.sec.android.app.shealth", 0).versionName
                } catch (e: Exception) {}
                findViewById<TextView>(R.id.tv_phone_info).text = "- 모델명/OS: $phoneOs\n- 삼성헬스 버전: $healthVersion"
                
                val hasSysPerm = packageManager.checkPermission(Manifest.permission.ACCESS_FINE_LOCATION, "com.sec.android.app.shealth") == PackageManager.PERMISSION_GRANTED ||
                                 packageManager.checkPermission(Manifest.permission.ACCESS_COARSE_LOCATION, "com.sec.android.app.shealth") == PackageManager.PERMISSION_GRANTED
                
                // 0: FAIL, 1: PASS, 2: 직접 확인 필요(우회 막힘)
                var healthInternalStatus = 2 
                try {
                    val uri = Uri.parse("content://com.sec.android.app.shealth/settings")
                    val cursor = contentResolver.query(uri, null, "key = ?", arrayOf("location_information_enabled"), null)
                    if (cursor != null && cursor.moveToFirst()) {
                        val idx = cursor.getColumnIndex("value")
                        if (idx != -1) {
                            healthInternalStatus = if (cursor.getInt(idx) == 1) 1 else 0
                        }
                        cursor.close()
                    }
                } catch (e: Exception) {
                    healthInternalStatus = 2
                }
                
                val tvSys = findViewById<TextView>(R.id.tv_sys_perm)
                val tvHealth = findViewById<TextView>(R.id.tv_sh_perm)
                val tvFinal = findViewById<TextView>(R.id.tv_final_status)
                
                if (hasSysPerm) {
                    tvSys.apply { text = "1. 시스템 위치 권한 : 🟢 PASS"; setTextColor(Color.parseColor("#388E3C")) }
                } else {
                    tvSys.apply { text = "1. 시스템 위치 권한 : 🔴 FAIL"; setTextColor(Color.parseColor("#D32F2F")) }
                }
                
                when (healthInternalStatus) {
                    1 -> tvHealth.apply { text = "2. 헬스 설정 위치 정보 : 🟢 PASS"; setTextColor(Color.parseColor("#388E3C")) }
                    0 -> tvHealth.apply { text = "2. 헬스 설정 위치 정보 : 🔴 FAIL"; setTextColor(Color.parseColor("#D32F2F")) }
                    else -> tvHealth.apply { text = "2. 헬스 설정 위치 정보 : ⚠️ 직접 확인 필요"; setTextColor(Color.parseColor("#F57C00")) }
                }
                
                if (hasSysPerm && healthInternalStatus == 1) {
                    tvFinal.apply { 
                        text = "📢 최종 상태 : 🟢 PASS (검증 통과!)"
                        setBackgroundColor(Color.parseColor("#E8F5E9"))
                        setTextColor(Color.parseColor("#2E7D32"))
                    }
                } else if (!hasSysPerm || healthInternalStatus == 0) {
                    tvFinal.apply { 
                        text = "📢 최종 상태 : 🔴 FAIL (조치 필요!)"
                        setBackgroundColor(Color.parseColor("#FFEBEE"))
                        setTextColor(Color.parseColor("#C62828"))
                    }
                } else {
                    tvFinal.apply { 
                        text = "📢 최종 상태 : ⚠️ 직접 확인 필요 (보류)"
                        setBackgroundColor(Color.parseColor("#FFF3E0"))
                        setTextColor(Color.parseColor("#E65100"))
                    }
                }
            }
        }
        EOF

    - name: APK 앱 굽기
      run: gradle assembleDebug

    - name: 구워진 앱 추출하기
      uses: actions/upload-artifact@v4
      with:
        name: HealthChecker-App-V2
        path: app/build/outputs/apk/debug/app-debug.apk
