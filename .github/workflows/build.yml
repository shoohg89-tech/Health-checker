name: Build Health Checker App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: 자바 환경 세팅
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 기계 버전 8.4로 고정 세팅
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'

    - name: 앱 코드 자동 생성
      run: |
        mkdir -p app/src/main/java/com/samsung/healthchecker
        
        # 1. 설정 파일 생성 (AndroidX 활성화)
        cat << 'EOF' > gradle.properties
        android.useAndroidX=true
        android.enableJetifier=true
        EOF

        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories { google(); mavenCentral(); gradlePluginPortal() }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories { google(); mavenCentral() }
        }
        rootProject.name = "HealthChecker"
        include ':app'
        EOF
        
        cat << 'EOF' > build.gradle
        plugins {
            id 'com.android.application' version '8.1.1' apply false
            id 'org.jetbrains.kotlin.android' version '1.9.0' apply false
        }
        EOF
        
        cat << 'EOF' > app/build.gradle
        plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
        android {
            namespace 'com.samsung.healthchecker'
            compileSdk 34
            defaultConfig { applicationId "com.samsung.healthchecker"; minSdk 24; targetSdk 34; versionCode 1; versionName "1.0" }
            
            # 자바 빌드 버전을 17로 완벽하게 고정시키는 옵션 (에러 해결 핵심!)
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
            kotlinOptions {
                jvmTarget = '17'
            }
        }
        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
        }
        EOF
        
        # 2. 안드로이드 시스템 권한 파일 생성 (에러가 제안한 대로 패키지 중복 제거 반영)
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <queries><package android:name="com.sec.android.app.shealth" /></queries>
            <application android:label="Health 검증앱" android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                <activity android:name="com.samsung.healthchecker.MainActivity" android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF
        
        # 3. 메인 화면 동작 코드
        cat << 'EOF' > app/src/main/java/com/samsung/healthchecker/MainActivity.kt
        package com.samsung.healthchecker
        import android.content.Intent
        import android.net.Uri
        import android.os.Build
        import android.os.Bundle
        import android.provider.Settings
        import android.widget.Button
        import android.widget.LinearLayout
        import android.widget.TextView
        import androidx.appcompat.app.AppCompatActivity
        import android.graphics.Color
        
        class MainActivity : AppCompatActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                val layout = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(50, 80, 50, 50) }
                
                // 폰 버전 / 헬스 버전 가져오기
                val phoneOs = Build.DISPLAY
                var healthVersion = "설치 안됨"
                try {
                    healthVersion = packageManager.getPackageInfo("com.sec.android.app.shealth", 0).versionName
                } catch (e: Exception) {}
                
                layout.addView(TextView(this).apply { text = "⚙️ Health 검증 도우미 v1.0\n\n📱 내 폰 정보\n - 모델/OS: $phoneOs\n - 삼성헬스 버전: $healthVersion\n\n"; textSize = 18f; setTextColor(Color.BLACK) })
                
                // 삼성 헬스 권한 이동 버튼
                layout.addView(Button(this).apply {
                    text = "📍 삼성 헬스 '권한 설정' 열기"
                    setOnClickListener {
                        startActivity(Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS).apply { data = Uri.parse("package:com.sec.android.app.shealth") })
                    }
                })
                
                // GPS 이동 버튼
                layout.addView(Button(this).apply { text = "📡 스마트폰 'GPS 설정' 열기"; setOnClickListener { startActivity(Intent(Settings.ACTION_LOCATION_SOURCE_SETTINGS)) } })
                
                setContentView(layout)
            }
        }
        EOF

    - name: APK 앱 굽기
      run: gradle assembleDebug

    - name: 구워진 앱 추출하기
      uses: actions/upload-artifact@v4
      with:
        name: HealthChecker-App
        path: app/build/outputs/apk/debug/app-debug.apk
