name: Build Health Checker App V3.8 (Final Stable)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: 자바 환경 세팅
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 기계 버전 8.4로 고정 세팅
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'
        cache-enabled: false

    - name: 앱 코드 자동 생성 (V3.8)
      run: |
        # 1. 폴더 뼈대 생성
        mkdir -p app/src/main/java/com/samsung/healthchecker
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/assets
        mkdir -p wear/src/main/java/com/samsung/healthchecker/wear
        mkdir -p wear/src/main/res/layout

        # 2. 최상위 설정 파일
        keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        echo "android.useAndroidX=true" > gradle.properties
        echo "android.enableJetifier=true" >> gradle.properties

        cat > settings.gradle << EOF
        pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
        dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
        rootProject.name = "HealthChecker"
        include ':app', ':wear'
        EOF

        cat > build.gradle << EOF
        plugins {
            id 'com.android.application' version '8.1.1' apply false
            id 'org.jetbrains.kotlin.android' version '1.9.0' apply false
        }
        EOF

        # 3. 폰 앱 (app) 코드
        cat > app/build.gradle << EOF
        plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
        android {
            namespace 'com.samsung.healthchecker'
            compileSdk 34
            defaultConfig { applicationId "com.samsung.healthchecker"; minSdk 24; targetSdk 34; versionCode 12; versionName "3.8" }
            signingConfigs { debugKeystore { storeFile file("../debug.keystore"); storePassword "android"; keyAlias "androiddebugkey"; keyPassword "android" } }
            buildTypes { debug { signingConfig signingConfigs.debugKeystore } }
            compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
            kotlinOptions { jvmTarget = '17' }
        }
        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.9.0'
        }
        EOF

        # 4. 워치 앱 (wear) 코드
        cat > wear/build.gradle << EOF
        plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
        android {
            namespace 'com.samsung.healthchecker.wear'
            compileSdk 33
            defaultConfig { applicationId "com.samsung.healthchecker.wear"; minSdk 28; targetSdk 33; versionCode 2; versionName "1.1" }
            signingConfigs { debugKeystore { storeFile file("../debug.keystore"); storePassword "android"; keyAlias "androiddebugkey"; keyPassword "android" } }
            buildTypes { debug { signingConfig signingConfigs.debugKeystore } }
            compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
            kotlinOptions { jvmTarget = '17' }
        }
        dependencies { implementation 'androidx.core:core-ktx:1.9.0' }
        EOF

        # 5. Manifest 및 레이아웃, 동작 코드 (가장 안정적인 버전)
        # (이하 코드는 V2.2/V3.7에서 검증된 안정적인 코드를 그대로 사용합니다)
        # ... (이하 생략)
        cp wear/build.gradle wear/build.gradle.kts_backup || true
        cat > wear/src/main/AndroidManifest.xml << EOF
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-feature android:name="android.hardware.type.watch" />
            <application android:label="Health 워치앱" android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                <activity android:name="com.samsung.healthchecker.wear.MainActivity" android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF
        cat > wear/src/main/res/layout/activity_main.xml << EOF
        <?xml version="1.0" encoding="utf-8"?>
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical" android:gravity="center" android:background="#000000">
            <TextView android:text="⌚ 워치앱\n\n정상 🟢" android:textColor="#FFFFFF" android:textSize="16sp" android:gravity="center" android:layout_width="wrap_content" android:layout_height="wrap_content"/>
        </LinearLayout>
        EOF
        cat > wear/src/main/java/com/samsung/healthchecker/wear/MainActivity.kt << EOF
        package com.samsung.healthchecker.wear
        import android.os.Bundle
        import androidx.appcompat.app.AppCompatActivity
        class MainActivity : AppCompatActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_main)
            }
        }
        EOF
        cat > app/src/main/AndroidManifest.xml << EOF
        <manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.INTERNET" /><queries><package android:name="com.sec.android.app.shealth" /></queries><application android:label="Health 검증앱" android:theme="@style/Theme.MaterialComponents.Light.NoActionBar"><activity android:name="com.samsung.healthchecker.MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter></activity></application></manifest>
        EOF
        cat > app/src/main/res/layout/activity_main.xml << EOF
        <?xml version="1.0" encoding="utf-8"?><ScrollView xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:background="#F4F7F9"><LinearLayout android:orientation="vertical" android:layout_width="match_parent" android:layout_height="wrap_content" android:padding="16dp"><TextView android:text="⚙️ Health 검증 도우미 v3.8" android:textSize="22sp" android:textStyle="bold" android:textColor="#0054A6" android:layout_width="match_parent" android:layout_height="wrap_content" android:layout_marginBottom="16dp" android:gravity="center"/><LinearLayout android:orientation="vertical" android:background="#FFFFFF" android:elevation="4dp" android:padding="16dp" android:layout_width="match_parent" android:layout_height="wrap_content" android:layout_marginBottom="16dp"><TextView android:text="📱 내 폰 정보" android:textSize="18sp" android:textStyle="bold" android:textColor="#0054A6" android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_marginBottom="8dp"/><TextView android:id="@+id/tv_phone_info" android:text="불러오는 중..." android:textColor="#333333" android:textSize="14sp" android:layout_width="wrap_content" android:layout_height="wrap_content"/></LinearLayout><LinearLayout android:orientation="vertical" android:background="#FFFFFF" android:elevation="4dp" android:padding="16dp" android:layout_width="match_parent" android:layout_height="wrap_content" android:layout_marginBottom="16dp"><TextView android:text="🔍 실시간 자동 검증 결과" android:textSize="18sp" android:textStyle="bold" android:textColor="#0054A6" android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_marginBottom="8dp"/><TextView android:id="@+id/tv_sys_perm" android:text="1. 시스템 위치 권한 : ⏳ 대기중" android:textSize="15sp" android:textStyle="bold" android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_marginBottom="6dp"/><TextView android:id="@+id/tv_sh_perm" android:text="2. 헬스 설정 위치 정보 : ⏳ 대기중" android:textSize="15sp" android:textStyle="bold" android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_marginBottom="16dp"/><TextView android:id="@+id/tv_final_status" android:text="📢 상태 분석중..." android:textSize="18sp" android:textStyle="bold" android:layout_width="match_parent" android:layout_height="wrap_content" android:layout_marginBottom="12dp" android:gravity="center" android:padding="8dp"/><Button android:id="@+id/btn_health_settings" android:text="📍 헬스 '위치 정보' 토글 확인하기 ↗" android:backgroundTint="#0054A6" android:textColor="#FFFFFF" android:layout_width="match_parent" android:layout_height="wrap_content"/></LinearLayout><LinearLayout android:orientation="vertical" android:background="#FFFFFF" android:elevation="4dp" android:padding="16dp" android:layout_width="match_parent" android:layout_height="wrap_content"><TextView android:text="⌚ 워치 무선 세팅 (V3.8)" android:textSize="18sp" android:textStyle="bold" android:textColor="#0054A6" android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_marginBottom="8dp"/><EditText android:id="@+id/et_ip" android:hint="IP:포트 입력 (예: 192.168.0.15:5555)" android:inputType="textUri" android:layout_width="match_parent" android:layout_height="wrap_content" android:layout_marginBottom="8dp"/><TextView android:id="@+id/tv_adb_status" android:text="상태: 대기 중" android:layout_width="match_parent" android:layout_height="wrap_content" android:gravity="center" android:layout_marginBottom="8dp" /><Button android:id="@+id/btn_adb_install" android:text="📡 워치에 짝꿍 앱 무선 설치" android:backgroundTint="#0054A6" android:textColor="#FFFFFF" android:layout_width="match_parent" android:layout_height="wrap_content"/></LinearLayout></LinearLayout></ScrollView>
        EOF
        cat > app/src/main/java/com/samsung/healthchecker/MainActivity.kt << EOF
        package com.samsung.healthchecker
        import android.Manifest
        import android.content.Intent
        import android.content.pm.PackageManager
        import android.graphics.Color
        import android.net.Uri
        import android.os.Build
        import android.os.Bundle
        import android.os.Handler
        import android.os.Looper
        import android.provider.Settings
        import android.widget.Button
        import android.widget.EditText
        import android.widget.TextView
        import androidx.appcompat.app.AppCompatActivity
        import kotlin.concurrent.thread
        class MainActivity : AppCompatActivity() {
            private lateinit var adbStatusTextView: TextView
            private lateinit var adbButton: Button
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_main)
                adbStatusTextView = findViewById(R.id.tv_adb_status)
                adbButton = findViewById(R.id.btn_adb_install)
                findViewById<Button>(R.id.btn_health_settings).setOnClickListener {
                    try { startActivity(Intent(Intent.ACTION_VIEW, Uri.parse("shealth://settings"))) } 
                    catch (e: Exception) { startActivity(Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS).apply { data = Uri.parse("package:com.sec.android.app.shealth") }) }
                }
                adbButton.setOnClickListener {
                    if (findViewById<EditText>(R.id.et_ip).text.toString().contains(":")) { installWatchApp() } 
                    else { updateStatus("IP와 포트 번호를 정확히 입력해주세요.", true) }
                }
            }
            private fun installWatchApp() {
                adbButton.isEnabled = false
                updateStatus("UI 테스트: 연결 시도 중...", false)
                thread {
                    try {
                        Thread.sleep(1500)
                        updateStatus("UI 테스트: 전송 중... 50%", false)
                        Thread.sleep(2000)
                        updateStatus("UI 테스트: 설치 완료!", true)
                    } catch (e: Exception) { updateStatus("UI 테스트 실패: ${e.message}", true) }
                }
            }
            private fun updateStatus(message: String, isEnabled: Boolean) {
                Handler(Looper.getMainLooper()).post {
                    adbStatusTextView.text = "상태: $message"
                    adbButton.isEnabled = isEnabled
                }
            }
            override fun onResume() { super.onResume(); refreshStatus() }
            private fun refreshStatus() { val phoneOs = Build.DISPLAY; var healthVersion = "설치 안됨"; try { healthVersion = packageManager.getPackageInfo("com.sec.android.app.shealth", 0).versionName } catch (e: Exception) {}; findViewById<TextView>(R.id.tv_phone_info).text = "- 모델명/OS: $phoneOs\n- 삼성헬스 버전: $healthVersion"; val hasSysPerm = packageManager.checkPermission(Manifest.permission.ACCESS_FINE_LOCATION, "com.sec.android.app.shealth") == PackageManager.PERMISSION_GRANTED; var healthInternalStatus = 2; try { val uri = Uri.parse("content://com.sec.android.app.shealth/settings"); val cursor = contentResolver.query(uri, null, "key = ?", arrayOf("location_information_enabled"), null); if (cursor != null && cursor.moveToFirst()) { val idx = cursor.getColumnIndex("value"); if (idx != -1) { healthInternalStatus = if (cursor.getInt(idx) == 1) 1 else 0 }; cursor.close() } } catch (e: Exception) { healthInternalStatus = 2 }; val tvSys = findViewById<TextView>(R.id.tv_sys_perm); val tvHealth = findViewById<TextView>(R.id.tv_sh_perm); val tvFinal = findViewById<TextView>(R.id.tv_final_status); if (hasSysPerm) { tvSys.apply { text = "1. 시스템 위치 권한 : 🟢 PASS"; setTextColor(Color.parseColor("#388E3C")) } } else { tvSys.apply { text = "1. 시스템 위치 권한 : 🔴 FAIL"; setTextColor(Color.parseColor("#D32F2F")) } }; when (healthInternalStatus) { 1 -> tvHealth.apply { text = "2. 헬스 설정 위치 정보 : 🟢 PASS"; setTextColor(Color.parseColor("#388E3C")) }; 0 -> tvHealth.apply { text = "2. 헬스 설정 위치 정보 : 🔴 FAIL"; setTextColor(Color.parseColor("#D32F2F")) }; else -> tvHealth.apply { text = "2. 헬스 설정 위치 정보 : ⚠️ 직접 확인 필요"; setTextColor(Color.parseColor("#F57C00")) } }; if (hasSysPerm && healthInternalStatus == 1) { tvFinal.apply { text = "📢 최종 상태 : 🟢 PASS (검증 통과!)"; setBackgroundColor(Color.parseColor("#E8F5E9")); setTextColor(Color.parseColor("#2E7D32")) } } else if (!hasSysPerm || healthInternalStatus == 0) { tvFinal.apply { text = "📢 최종 상태 : 🔴 FAIL (조치 필요!)"; setBackgroundColor(Color.parseColor("#FFEBEE")); setTextColor(Color.parseColor("#C62828")) } } else { tvFinal.apply { text = "📢 최종 상태 : ⚠️ 직접 확인 (보류)"; setBackgroundColor(Color.parseColor("#FFF3E0")); setTextColor(Color.parseColor("#E65100")) } } }
        }
        EOF

    - name: 폰/워치 앱 빌드
      run: gradle assembleDebug

    - name: (CCTV) 최종 파일 목록 확인
      run: ls -R

    - name: 최종 결과물 추출
      uses: actions/upload-artifact@v4
      with:
        name: HealthChecker-App-V3.8
        path: '**/*.apk'

