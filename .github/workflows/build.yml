name: Build Health Checker App V3 (Phone + Watch)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: 자바 환경 세팅
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 기계 버전 8.4로 고정 세팅 (캐시 비활성화)
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'
        cache-enabled: false

    - name: 앱 코드 자동 생성 (V3.0 폰+워치 동시 빌드)
      run: |
        # 폰 앱 폴더 생성
        mkdir -p app/src/main/java/com/samsung/healthchecker
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/values

        # 워치 앱 폴더 생성
        mkdir -p wear/src/main/java/com/samsung/healthchecker/wear
        mkdir -p wear/src/main/res/layout

        # --- 1. 최상위 설정 파일들 ---
        keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        
        echo "android.useAndroidX=true\nandroid.enableJetifier=true" > gradle.properties

        cat << 'EOF' > settings.gradle
        pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
        dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
        rootProject.name = "HealthChecker"
        include ':app'
        include ':wear'
        EOF
        
        cat << 'EOF' > build.gradle
        plugins {
            id 'com.android.application' version '8.1.1' apply false
            id 'com.android.wear.application' version '8.1.1' apply false
            id 'org.jetbrains.kotlin.android' version '1.9.0' apply false
        }
        EOF

        # --- 2. 폰 앱 (app) 코드 ---
        cat << 'EOF' > app/build.gradle
        plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
        android {
            namespace 'com.samsung.healthchecker'
            compileSdk 34
            defaultConfig { applicationId "com.samsung.healthchecker"; minSdk 24; targetSdk 34; versionCode 4; versionName "3.0" }
            signingConfigs {
                debugKeystore { storeFile file("../debug.keystore"); storePassword "android"; keyAlias "androiddebugkey"; keyPassword "android" }
            }
            buildTypes {
                debug { signingConfig signingConfigs.debugKeystore }
            }
            compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
            kotlinOptions { jvmTarget = '17' }
        }
        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.9.0'
            // ADB 통신을 위한 라이브러리 추가!
            implementation 'com.github.vidhuc.local-adb-android:local-adb-lib:0.3'
            wearApp project(":wear")
        }
        EOF

        cp app/build.gradle app/build.gradle.kts_backup # workaround for a known issue

        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <queries><package android:name="com.sec.android.app.shealth" /></queries>
            <application android:label="Health 검증앱" android:theme="@style/Theme.MaterialComponents.Light.NoActionBar">
                <activity android:name="com.samsung.healthchecker.MainActivity" android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF
        
        # (레이아웃 XML 과 폰 앱 동작 코드는 이전과 동일하게 유지, ADB 로직 추가)
        # ... (이전 V2.2 코드의 레이아웃, 동작 코드 부분이 여기에 들어감) ...
        # (생략 - 실제로는 전체 코드가 들어감)

        # --- 3. 워치 앱 (wear) 코드 ---
        cat << 'EOF' > wear/build.gradle
        plugins { id 'com.android.wear.application'; id 'org.jetbrains.kotlin.android' }
        android {
            namespace 'com.samsung.healthchecker.wear'
            compileSdk 33
            defaultConfig { applicationId "com.samsung.healthchecker.wear"; minSdk 28; targetSdk 33; versionCode 1; versionName "1.0" }
            compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
            kotlinOptions { jvmTarget = '17' }
        }
        dependencies {
            implementation 'androidx.core:core-ktx:1.9.0'
            implementation 'com.google.android.gms:play-services-wearable:18.1.0'
        }
        EOF

        cat << 'EOF' > wear/src/main/AndroidManifest.xml
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-feature android:name="android.hardware.type.watch" />
            <application android:label="Health 검증 도우미(워치)">
                 <meta-data android:name="com.google.android.wearable.standalone" android:value="false" />
            </application>
        </manifest>
        EOF

        cat << 'EOF' > wear/src/main/java/com/samsung/healthchecker/wear/MainActivity.kt
        package com.samsung.healthchecker.wear
        // 워치 앱은 현재 아무 기능 없이 껍데기만 있어도 됨
        class MainActivity {}
        EOF

    - name: APK 앱 굽기 (폰 + 워치)
      run: |
        # 워치 앱 먼저 빌드
        ./gradlew :wear:assembleDebug
        # 폰 앱 빌드
        ./gradlew :app:assembleDebug

    - name: 구워진 앱들 추출하기
      uses: actions/upload-artifact@v4
      with:
        name: HealthChecker-App-V3-Phone-And-Watch
        path: |
          app/build/outputs/apk/debug/app-debug.apk
          wear/build/outputs/apk/debug/wear-debug.apk

